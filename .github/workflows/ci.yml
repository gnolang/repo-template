name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Gno
        run: |
          make install_deps
          echo "$HOME/.gno/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: make test

      - name: Run linter
        run: make lint
